version: "2"

linters:
  # Default linters (errcheck, govet, staticcheck, etc.) remain enabled.
  enable:
    - misspell   # catch common spelling mistakes in comments and strings
    - noctx      # detect http calls without context
    - gosec      # security checks
    - revive     # opinionated but practical style checks
  settings:
    revive:
      rules:
        - name: exported
          disabled: true   # don't require every exported symbol to have a doc comment
    errcheck:
      # Writes to stdout/stderr in the commands: a failure there has nowhere
      # to be reported.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    gosec:
      excludes:
        # Integer narrowing is the substance of a video decoder: syntax
        # elements, coefficients and samples are converted to their bit-exact
        # widths on purpose, hundreds of times.
        - G115
        # The assembly kernels take raw pointers into the frame and grid
        # buffers; unsafe.Pointer is the only way to hand a []mv over as *int32.
        - G103
    staticcheck:
      checks:
        - all
        - -QF1003   # "could use tagged switch": a style preference the code does not share
  exclusions:
    rules:
      # G602 misreads the scaling-list loop in params.go: the index is
      # guarded by the branch it is used in (i < 6 for the 4x4 lists).
      - path: params\.go
        text: "G602"
      # errcheck and gosec are noisy in test helpers — allow unchecked calls,
      # math/rand and file paths from variables in _test.go files.
      - path: _test\.go
        linters: [errcheck, gosec]
