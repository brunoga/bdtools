<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>bdtools</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2027"/>
      <stop offset="1" stop-color="#0d0f12"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>
  <!-- a disc, seen by the two eyes: the right's warm, the left's cool, a
       little apart, white where they agree -->
  <circle cx="35" cy="32" r="17" fill="none" stroke="#ff8a5c" stroke-width="8" opacity="0.8"/>
  <circle cx="29" cy="32" r="17" fill="none" stroke="#5fb0ff" stroke-width="8" opacity="0.8"/>
  <circle cx="32" cy="32" r="4" fill="#e9f2ff" opacity="0.9"/>
</svg>
