name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install the libva and mingw-w64 headers
        # TestVAAPILayout checks the VAAPI struct offsets against libva's, and
        # TestMFConstants the Media Foundation GUIDs, constants and vtable
        # slots against mingw-w64's Windows SDK headers.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libva-dev mingw-w64-common mingw-w64-x86-64-dev

      - name: Test
        # The end-to-end conversion tests skip when x264 is not installed,
        # which it is not here; the GPU encoder tests skip without a GPU.
        # The race detector slows the Go encoders' conversions several
        # times over, and the packages share the runner's cores.
        env:
          MVC_MF_HEADERS: /usr/share/mingw-w64/include:/usr/x86_64-w64-mingw32/include
        run: go test -race -timeout 1200s ./...

      - name: Test the pure-Go decoder
        # Every assembly kernel has a Go fallback selected by this tag (and
        # on every non-amd64 platform); the conformance corpus must pass
        # through it too. The packages share the runner's cores
        # (internal/convert 290 to 300 s), hence the timeout.
        run: go test -tags purego -timeout 600s ./...

  test-macos:
    name: Test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install ffmpeg and x265
        # The VideoToolbox decoder and the HEVC one here are checked picture
        # by picture against ffmpeg's decode (of x265's streams), and the
        # conversions encode with x265.
        run: brew install ffmpeg x265

      - name: Test VideoToolbox
        # The virtual Macs have no media engine, so the VideoToolbox tests
        # fall back to Apple's software encoder and decoders: the same API
        # and code. They fail now and then (an IOKit error, -536870212),
        # more often with sessions of several packages at once: one
        # package at a time. The runners' speed varies by a third
        # (internal/convert 290 to 400 s), hence the timeout.
        run: go test -p 1 -timeout 600s ./internal/gpu/... ./internal/convert/... ./internal/hevc/...

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Enable Media Foundation
        # An optional feature on Windows Server; without it the tests skip.
        shell: pwsh
        continue-on-error: true
        run: Install-WindowsFeature Server-Media-Foundation

      - name: Test Media Foundation
        # The virtual machines have no GPU, so the tests use Microsoft's
        # software encoder MFTs: the same API and code, only synchronous.
        # -v shows whether they ran or skipped. Only the encoder tests of
        # convert run here: the others assert Unix paths.
        run: |
          go test -v -timeout 300s ./internal/gpu/...
          go test -timeout 300s -run "MediaFoundation|SupportsEncoder" ./internal/convert/...

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }}${{ matrix.goarm && format('/v{0}', matrix.goarm) || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - {goos: linux,   goarch: amd64}
          - {goos: linux,   goarch: arm64}
          - {goos: linux,   goarch: arm,   goarm: "7"}
          # Windows
          - {goos: windows, goarch: amd64}
          - {goos: windows, goarch: arm64}
          # macOS
          - {goos: darwin,  goarch: amd64}
          - {goos: darwin,  goarch: arm64}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Cross-compile
        env:
          GOOS:        ${{ matrix.goos }}
          GOARCH:      ${{ matrix.goarch }}
          GOARM:       ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: |
          VERSION=$(git describe --tags --dirty --always 2>/dev/null || echo "dev")
          go build -ldflags "-s -w -X main.version=${VERSION}" ./cmd/mvcdec
          # bdtools reasons about the platform it runs on, so it has to build
          # for every platform it claims to support, not just the host.
          go build -ldflags "-s -w -X main.version=${VERSION}" ./cmd/bdtools
          go vet ./...

      - name: Verify go.mod is tidy
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Run golangci-lint
        run: golangci-lint run --timeout 5m

  # Summary job so branch-protection can require a single "Build" check
  # instead of one entry per matrix combination.
  build-summary:
    name: Build
    needs: [build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all builds passed
        run: |
          if [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "One or more cross-compile jobs failed"
            exit 1
          fi
